# letakkan di /etc/nginx/sites-available/yomi, lalu: certbot --nginx -d yomi.example.com
server {
    listen 80;
    server_name yomi.example.com;
    root /var/www/yomi;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* ^/(sw\.js|index\.html|manifest\.webmanifest|registerSW\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
